<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Joke Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      max-width: 500px;
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
    }

    #jokeText {
      font-size: 18px;
      color: #555;
      margin: 20px 0;
      min-height: 60px;
      line-height: 1.6;
    }

    button {
      background-color: #667eea;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #764ba2;
    }

    button:active {
      transform: scale(0.98);
    }

    .loading {
      color: #999;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>😂 Joke Generator</h1>
    <div id="jokeText" class="loading">Click the button to get a joke!</div>
    <button onclick="fetchJoke()">Get a Joke</button>
  </div>

  <script>
    async function fetchJoke() {
      const jokeText = document.getElementById('jokeText');
      jokeText.textContent = 'Loading...';
      jokeText.classList.add('loading');

      try {
        const response = await fetch('https://icanhazdadjoke.com/?format=json');
        const data = await response.json();
        jokeText.textContent = data.joke;
        jokeText.classList.remove('loading');
      } catch (error) {
        jokeText.textContent = 'Error fetching joke. Try again!';
        console.error('Error:', error);
      }
    }

    // Fetch a joke on page load
    window.addEventListener('load', fetchJoke);
  </script>
</body>
</html>
